<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Ops</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a; color: #e5e5e5;
      min-height: 100vh;
    }
    header {
      border-bottom: 1px solid #262626;
      padding: 16px 24px;
      display: flex; align-items: center; gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }

    nav {
      border-bottom: 1px solid #262626;
      padding: 0 24px;
      display: flex; gap: 0; overflow-x: auto;
    }
    nav button {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: #a3a3a3; padding: 12px 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all 0.15s;
    }
    nav button:hover { color: #e5e5e5; }
    nav button.active {
      color: #e5e5e5; border-bottom-color: #22c55e;
    }

    main { max-width: 900px; margin: 0 auto; padding: 24px; }

    .script-card {
      background: #171717; border: 1px solid #262626; border-radius: 12px;
      padding: 20px;
    }
    .script-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .script-card p { font-size: 13px; color: #a3a3a3; margin-bottom: 16px; }

    /* Life Time busyness dashboard */
    .lifetime-dashboard { display: grid; gap: 16px; }
    .lifetime-hero,
    .lifetime-panel {
      background: #171717; border: 1px solid #262626; border-radius: 12px;
      padding: 20px;
    }
    .lifetime-heading {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 16px; margin-bottom: 18px;
    }
    .lifetime-heading h2 { font-size: 21px; margin-bottom: 4px; }
    .lifetime-heading p { color: #a3a3a3; font-size: 13px; line-height: 1.5; }
    .lifetime-heading a { color: #86efac; }
    .refresh-btn {
      background: #262626; color: #e5e5e5; border: 1px solid #404040;
      border-radius: 8px; padding: 7px 12px; cursor: pointer; white-space: nowrap;
    }
    .refresh-btn:hover { background: #333; }
    .current-grid {
      display: grid; grid-template-columns: minmax(180px, 0.8fr) 1.4fr;
      gap: 16px;
    }
    .current-score {
      min-height: 172px; background: #0a0a0a; border: 1px solid #262626;
      border-radius: 10px; padding: 18px; display: flex; flex-direction: column;
      justify-content: center;
    }
    .eyebrow {
      color: #a3a3a3; font-size: 11px; text-transform: uppercase;
      letter-spacing: .08em; margin-bottom: 8px;
    }
    .score-label { font-size: 30px; font-weight: 700; }
    .score-number { color: #a3a3a3; font-size: 13px; margin-top: 4px; }
    .score-meter {
      height: 7px; margin-top: 14px; background: #262626; border-radius: 99px;
      overflow: hidden;
    }
    .score-meter span { display: block; height: 100%; border-radius: 99px; }
    .score-details {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
    }
    .detail-card { background: #0a0a0a; border-radius: 10px; padding: 14px; }
    .detail-value { font-size: 20px; font-weight: 650; }
    .detail-label { color: #a3a3a3; font-size: 11px; margin-top: 3px; }
    .method-note {
      color: #737373; font-size: 12px; line-height: 1.5; margin-top: 12px;
    }
    .panel-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .panel-copy { color: #a3a3a3; font-size: 12px; line-height: 1.5; }
    .recommendations {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px; margin-top: 14px;
    }
    .recommendation {
      background: #0a0a0a; border: 1px solid #262626; border-radius: 10px;
      padding: 14px;
    }
    .recommendation-time { font-size: 17px; font-weight: 650; margin-top: 3px; }
    .recommendation-score { color: #86efac; font-size: 12px; margin-top: 7px; }
    .rating-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .rating-btn {
      background: #0a0a0a; color: #d4d4d4; border: 1px solid #404040;
      border-radius: 8px; padding: 8px 12px; cursor: pointer;
    }
    .rating-btn:hover, .rating-btn:focus { border-color: #22c55e; outline: none; }
    .rating-status { min-height: 18px; margin-top: 9px; color: #86efac; font-size: 12px; }
    .heatmap-wrap { overflow-x: auto; margin-top: 14px; }
    .heatmap { border-collapse: separate; border-spacing: 3px; min-width: 760px; width: 100%; }
    .heatmap th { color: #737373; font-size: 10px; font-weight: 500; padding: 4px; }
    .heatmap th:first-child { text-align: left; position: sticky; left: 0; background: #171717; }
    .heatmap td { height: 28px; min-width: 29px; border-radius: 4px; text-align: center; font-size: 10px; }
    .heatmap-legend { display: flex; align-items: center; gap: 7px; margin-top: 10px; color: #737373; font-size: 11px; }
    .legend-gradient { width: 110px; height: 7px; border-radius: 99px; background: linear-gradient(90deg, #14532d, #ca8a04, #b91c1c); }
    .source-line { color: #737373; font-size: 11px; margin-top: 12px; }
    .dashboard-error { color: #fca5a5; line-height: 1.5; }
    @media (max-width: 680px) {
      header, nav { padding-left: 16px; padding-right: 16px; }
      main { padding: 16px; }
      .current-grid { grid-template-columns: 1fr; }
      .recommendations { grid-template-columns: 1fr; }
      .score-details { grid-template-columns: repeat(3, 1fr); }
    }

    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }

    label.flag {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; cursor: pointer; user-select: none;
    }
    label.flag input[type="checkbox"] {
      accent-color: #22c55e; width: 16px; height: 16px;
    }

    .input-group { display: flex; align-items: center; gap: 6px; }
    .input-group label { font-size: 13px; color: #a3a3a3; white-space: nowrap; }
    .input-group input,
    .input-group select {
      background: #0a0a0a; border: 1px solid #404040; border-radius: 6px;
      color: #e5e5e5; padding: 6px 10px; font-size: 13px; width: 140px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .input-group input:focus,
    .input-group select:focus { outline: none; border-color: #22c55e; }

    button.run {
      background: #22c55e; color: #0a0a0a; border: none; border-radius: 8px;
      padding: 8px 20px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s;
    }
    button.run:hover { opacity: 0.9; }
    button.run:disabled { opacity: 0.4; cursor: not-allowed; }
    button.run.running { background: #ef4444; color: white; }

    .output {
      background: #0a0a0a; border: 1px solid #262626; border-radius: 8px;
      padding: 12px 16px; font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px; line-height: 1.6; max-height: 400px; overflow-y: auto;
      white-space: pre-wrap; word-break: break-word; display: none;
    }
    .output.visible { display: block; }
    .stderr { color: #f87171; }
    .exit-ok { color: #22c55e; font-weight: 600; }
    .exit-fail { color: #ef4444; font-weight: 600; }

    /* Properties table */
    .props-section {
      background: #171717; border: 1px solid #262626; border-radius: 12px;
      padding: 20px; margin-top: 16px;
    }
    .props-section h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
    .props-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    table.props { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.props th {
      text-align: left; padding: 8px 12px; color: #a3a3a3; font-weight: 500;
      border-bottom: 1px solid #262626; font-size: 12px; text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    table.props td {
      padding: 10px 12px; border-bottom: 1px solid #1a1a1a; vertical-align: top;
    }
    table.props tr:hover td { background: #1a1a1a; }
    .cert { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; color: #a3a3a3; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 9999px;
      font-size: 11px; font-weight: 500;
    }
    .badge-active { background: #052e16; color: #4ade80; }
    .badge-inactive { background: #1c1917; color: #a3a3a3; }
    .addr { font-size: 12px; color: #737373; }
    .listings-list { font-size: 12px; color: #a3a3a3; }
    .action-btns { display: flex; gap: 6px; }
    .btn-sm {
      background: #262626; color: #e5e5e5; border: 1px solid #404040; border-radius: 6px;
      padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    .btn-sm:hover { background: #333; }
    .btn-sm.danger { color: #f87171; border-color: #7f1d1d; }
    .btn-sm.danger:hover { background: #450a0a; }
    button.btn-add {
      background: #22c55e; color: #0a0a0a; border: none; border-radius: 8px;
      padding: 6px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex;
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: #171717; border: 1px solid #262626; border-radius: 12px;
      padding: 24px; width: 480px; max-width: 90vw;
    }
    .modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .form-field { margin-bottom: 12px; }
    .form-field label { display: block; font-size: 12px; color: #a3a3a3; margin-bottom: 4px; }
    .form-field input, .form-field select {
      width: 100%; background: #0a0a0a; border: 1px solid #404040; border-radius: 6px;
      color: #e5e5e5; padding: 8px 10px; font-size: 13px;
    }
    .form-field input:focus { outline: none; border-color: #22c55e; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-cancel {
      background: #262626; color: #e5e5e5; border: 1px solid #404040; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; cursor: pointer;
    }
    .btn-save {
      background: #22c55e; color: #0a0a0a; border: none; border-radius: 8px;
      padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .form-check { display: flex; align-items: center; gap: 8px; }
    .form-check input { width: auto; }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>Local Ops</h1>
  </header>
  <nav id="tabs"></nav>
  <main id="app"></main>

  <script>
    const tabsEl = document.getElementById('tabs');
    const app = document.getElementById('app');
    let scripts = [];
    let activeTab = null;

    async function loadScripts() {
      const res = await fetch('/api/scripts');
      scripts = await res.json();
      // Restore tab from URL hash or default to first
      const hash = location.hash.slice(1);
      activeTab = scripts.find(s => s.id === hash)?.id ?? scripts[0]?.id;
      renderTabs();
      renderCard();
    }

    function renderTabs() {
      tabsEl.textContent = '';
      for (const s of scripts) {
        const btn = document.createElement('button');
        btn.textContent = s.name;
        btn.className = s.id === activeTab ? 'active' : '';
        btn.addEventListener('click', () => {
          activeTab = s.id;
          location.hash = s.id;
          renderTabs();
          renderCard();
        });
        tabsEl.appendChild(btn);
      }
    }

    // Keep output state across tab switches
    const outputState = {};

    function renderCard() {
      const s = scripts.find(sc => sc.id === activeTab);
      if (!s) return;

      app.textContent = '';

      if (s.type === 'lifetime-dashboard') {
        renderLifetimeDashboard();
        return;
      }

      const card = document.createElement('div');
      card.className = 'script-card';

      const h2 = document.createElement('h2');
      h2.textContent = s.name;
      card.appendChild(h2);

      const desc = document.createElement('p');
      desc.textContent = s.description;
      card.appendChild(desc);

      const controls = document.createElement('div');
      controls.className = 'controls';

      // Flags
      for (const f of (s.flags || [])) {
        const label = document.createElement('label');
        label.className = 'flag';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.dataset.script = s.id;
        cb.dataset.flag = f.id;
        if (f.default) cb.checked = true;
        label.appendChild(cb);
        label.appendChild(document.createTextNode(` ${f.label}`));
        controls.appendChild(label);
      }

      // Script-specific mode selector
      if (s.modes?.length) {
        const group = document.createElement('div');
        group.className = 'input-group';
        const lbl = document.createElement('label');
        lbl.textContent = 'Mode:';
        const select = document.createElement('select');
        select.dataset.script = s.id;
        select.dataset.input = 'mode';
        for (const mode of s.modes) {
          const option = document.createElement('option');
          option.value = mode.id;
          option.textContent = mode.label;
          select.appendChild(option);
        }
        select.addEventListener('change', () => updateScriptMode(s.id));
        group.appendChild(lbl);
        group.appendChild(select);
        controls.appendChild(group);
      }

      // Inputs
      for (const i of (s.inputs || [])) {
        const group = document.createElement('div');
        group.className = 'input-group';
        const lbl = document.createElement('label');
        lbl.textContent = `${i.label}:`;
        lbl.dataset.script = s.id;
        lbl.dataset.labelFor = i.id;
        const inp = document.createElement('input');
        inp.type = i.id.includes('date') ? 'date' : 'text';
        inp.dataset.script = s.id;
        inp.dataset.input = i.id;
        inp.placeholder = i.placeholder || '';
        if (inp.type === 'date') inp.value = getYesterdayDateValue();
        group.appendChild(lbl);
        group.appendChild(inp);
        controls.appendChild(group);
      }

      // Run button
      const btn = document.createElement('button');
      btn.className = 'run';
      btn.dataset.script = s.id;
      btn.textContent = activeControllers[s.id] ? 'Stop' : 'Run';
      if (activeControllers[s.id]) btn.classList.add('running');
      btn.addEventListener('click', () => runScript(s.id));
      controls.appendChild(btn);

      card.appendChild(controls);

      // Output — restore previous output if it exists
      const output = document.createElement('div');
      output.className = 'output';
      output.id = `output-${s.id}`;
      if (outputState[s.id]) {
        output.classList.add('visible');
        // Restore saved nodes
        for (const node of outputState[s.id]) {
          output.appendChild(node.cloneNode(true));
        }
        output.scrollTop = output.scrollHeight;
      }
      card.appendChild(output);

      app.appendChild(card);
      updateScriptMode(s.id);

      // Show properties table on clackamas-tax tab
      if (s.id === 'clackamas-tax') {
        const propsSection = document.createElement('div');
        propsSection.className = 'props-section';
        propsSection.id = 'props-section';
        app.appendChild(propsSection);
        loadProperties();
      }
    }

    // ─── Life Time Beaverton ──────────────────────────────────

    function createElement(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function formatHour(hour) {
      if (hour === 0 || hour === 24) return '12 AM';
      if (hour === 12) return '12 PM';
      return `${hour > 12 ? hour - 12 : hour} ${hour >= 12 ? 'PM' : 'AM'}`;
    }

    function scoreColor(score) {
      if (score <= 30) return '#22c55e';
      if (score <= 48) return '#84cc16';
      if (score <= 68) return '#eab308';
      if (score <= 84) return '#f97316';
      return '#ef4444';
    }

    async function renderLifetimeDashboard() {
      app.textContent = '';
      const loading = createElement('div', 'lifetime-panel', 'Loading Life Time Beaverton forecast…');
      loading.setAttribute('role', 'status');
      app.appendChild(loading);

      try {
        const response = await fetch('/api/lifetime/busyness');
        if (!response.ok) throw new Error(`Forecast request failed (${response.status})`);
        const forecast = await response.json();
        if (activeTab !== 'lifetime-beaverton') return;
        drawLifetimeDashboard(forecast);
      } catch (error) {
        loading.className = 'lifetime-panel dashboard-error';
        loading.textContent = `Could not load the forecast: ${error.message}`;
      }
    }

    function drawLifetimeDashboard(forecast) {
      app.textContent = '';
      const dashboard = createElement('div', 'lifetime-dashboard');

      const hero = createElement('section', 'lifetime-hero');
      const heading = createElement('div', 'lifetime-heading');
      const titleWrap = createElement('div');
      titleWrap.appendChild(createElement('h2', '', 'Life Time Beaverton'));
      const address = createElement('p');
      const clubLink = createElement('a', '', forecast.club.address);
      clubLink.href = forecast.club.pageUrl;
      clubLink.target = '_blank';
      clubLink.rel = 'noreferrer';
      address.appendChild(clubLink);
      titleWrap.appendChild(address);
      heading.appendChild(titleWrap);
      const refresh = createElement('button', 'refresh-btn', 'Refresh');
      refresh.type = 'button';
      refresh.addEventListener('click', renderLifetimeDashboard);
      heading.appendChild(refresh);
      hero.appendChild(heading);

      const currentGrid = createElement('div', 'current-grid');
      const currentCard = createElement('div', 'current-score');
      currentCard.appendChild(createElement('div', 'eyebrow', 'Right now'));
      if (forecast.current) {
        const label = createElement('div', 'score-label', forecast.current.label);
        label.style.color = scoreColor(forecast.current.score);
        currentCard.appendChild(label);
        currentCard.appendChild(createElement('div', 'score-number', `${forecast.current.score}/100 relative pressure`));
        const meter = createElement('div', 'score-meter');
        const fill = document.createElement('span');
        fill.style.width = `${forecast.current.score}%`;
        fill.style.background = scoreColor(forecast.current.score);
        meter.appendChild(fill);
        currentCard.appendChild(meter);
      } else {
        currentCard.appendChild(createElement('div', 'score-label', 'Closed'));
        currentCard.appendChild(createElement('div', 'score-number', 'See the next best windows below'));
      }
      currentGrid.appendChild(currentCard);

      const detailWrap = createElement('div');
      const details = createElement('div', 'score-details');
      const current = forecast.current;
      const detailData = current ? [
        [current.schedule.startingClasses, 'classes starting'],
        [current.schedule.waitlistedClasses, 'waitlisted classes'],
        [current.observations, 'personal samples'],
      ] : [[0, 'classes starting'], [0, 'waitlisted classes'], [forecast.observationCount, 'personal samples']];
      for (const [value, label] of detailData) {
        const card = createElement('div', 'detail-card');
        card.appendChild(createElement('div', 'detail-value', String(value)));
        card.appendChild(createElement('div', 'detail-label', label));
        details.appendChild(card);
      }
      detailWrap.appendChild(details);
      detailWrap.appendChild(createElement('p', 'method-note', `${forecast.methodology}. ${forecast.disclaimer}`));
      currentGrid.appendChild(detailWrap);
      hero.appendChild(currentGrid);
      dashboard.appendChild(hero);

      const bestPanel = createElement('section', 'lifetime-panel');
      bestPanel.appendChild(createElement('h3', 'panel-title', 'Best upcoming windows'));
      bestPanel.appendChild(createElement('p', 'panel-copy', 'Lowest estimated crowd pressure in the next 42 open hours.'));
      const recommendations = createElement('div', 'recommendations');
      for (const slot of forecast.recommendations) {
        const item = createElement('div', 'recommendation');
        const matchingDay = forecast.days.find(day => day.date === slot.date);
        item.appendChild(createElement('div', 'eyebrow', matchingDay?.label ?? slot.date));
        item.appendChild(createElement('div', 'recommendation-time', formatHour(slot.hour)));
        item.appendChild(createElement('div', 'recommendation-score', `${slot.label} · ${slot.score}/100`));
        recommendations.appendChild(item);
      }
      bestPanel.appendChild(recommendations);
      dashboard.appendChild(bestPanel);

      const ratingPanel = createElement('section', 'lifetime-panel');
      ratingPanel.appendChild(createElement('h3', 'panel-title', 'How busy is it while you’re there?'));
      ratingPanel.appendChild(createElement('p', 'panel-copy', 'One tap teaches the model what this weekday and hour actually feel like. Observations stay on this computer.'));
      const ratingRow = createElement('div', 'rating-row');
      const ratingLabels = ['Empty', 'Light', 'Normal', 'Busy', 'Packed'];
      const ratingStatus = createElement('div', 'rating-status');
      ratingStatus.setAttribute('role', 'status');
      ratingLabels.forEach((label, index) => {
        const button = createElement('button', 'rating-btn', label);
        button.type = 'button';
        button.addEventListener('click', async () => {
          ratingRow.querySelectorAll('button').forEach(item => { item.disabled = true; });
          try {
            const response = await fetch('/api/lifetime/busyness', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ level: index + 1 }),
            });
            if (!response.ok) throw new Error('Could not save observation');
            ratingStatus.textContent = 'Saved — the forecast now includes this observation.';
          } catch (error) {
            ratingStatus.textContent = error.message;
            ratingRow.querySelectorAll('button').forEach(item => { item.disabled = false; });
          }
        });
        ratingRow.appendChild(button);
      });
      ratingPanel.appendChild(ratingRow);
      ratingPanel.appendChild(ratingStatus);
      dashboard.appendChild(ratingPanel);

      const heatmapPanel = createElement('section', 'lifetime-panel');
      heatmapPanel.appendChild(createElement('h3', 'panel-title', 'Seven-day forecast'));
      heatmapPanel.appendChild(createElement('p', 'panel-copy', 'Lower numbers should mean easier parking and less competition for equipment.'));
      const heatmapWrap = createElement('div', 'heatmap-wrap');
      const table = createElement('table', 'heatmap');
      const allHours = [...new Set(forecast.days.flatMap(day => day.slots.map(slot => slot.hour)))].sort((a, b) => a - b);
      const headerRow = document.createElement('tr');
      headerRow.appendChild(createElement('th', '', 'Day'));
      for (const hour of allHours) {
        const th = createElement('th', '', hour % 2 === 0 ? formatHour(hour).replace(' ', '') : '');
        th.scope = 'col';
        headerRow.appendChild(th);
      }
      const thead = document.createElement('thead');
      thead.appendChild(headerRow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      for (const day of forecast.days) {
        const row = document.createElement('tr');
        const dayHeading = createElement('th', '', day.label);
        dayHeading.scope = 'row';
        row.appendChild(dayHeading);
        const slotByHour = new Map(day.slots.map(slot => [slot.hour, slot]));
        for (const hour of allHours) {
          const slot = slotByHour.get(hour);
          const cell = document.createElement('td');
          if (slot) {
            cell.textContent = slot.score;
            cell.style.background = `${scoreColor(slot.score)}99`;
            cell.style.color = slot.score > 68 ? '#fff' : '#f5f5f5';
            cell.setAttribute('aria-label', `${day.label} at ${formatHour(hour)}: ${slot.label}, score ${slot.score}`);
            cell.title = `${slot.label} · ${slot.schedule.startingClasses} classes starting · ${slot.observations} samples`;
          } else {
            cell.textContent = '—';
            cell.style.color = '#404040';
            cell.setAttribute('aria-label', `${day.label} at ${formatHour(hour)}: closed`);
          }
          row.appendChild(cell);
        }
        tbody.appendChild(row);
      }
      table.appendChild(tbody);
      heatmapWrap.appendChild(table);
      heatmapPanel.appendChild(heatmapWrap);
      const legend = createElement('div', 'heatmap-legend');
      legend.appendChild(createElement('span', '', 'Quieter'));
      legend.appendChild(createElement('span', 'legend-gradient'));
      legend.appendChild(createElement('span', '', 'Busier'));
      heatmapPanel.appendChild(legend);
      const sourceDate = forecast.schedule.fetchedAt
        ? new Date(forecast.schedule.fetchedAt).toLocaleString()
        : 'not available';
      const sourceLabel = forecast.schedule.source === 'live'
        ? 'Official Life Time schedule'
        : forecast.schedule.source === 'cache'
          ? 'Cached Life Time schedule'
          : 'Baseline only';
      heatmapPanel.appendChild(createElement('div', 'source-line', `${sourceLabel} · updated ${sourceDate} · confidence rises as you add observations.`));
      dashboard.appendChild(heatmapPanel);

      app.appendChild(dashboard);
    }

    // ─── Properties ────────────────────────────────────────────

    let properties = [];
    let listingNames = {};

    async function loadProperties() {
      const section = document.getElementById('props-section');
      if (!section) return;
      const propsRes = await fetch('/api/tax/properties');
      properties = await propsRes.json();
      const allIds = [...new Set(properties.flatMap(p => p.listing_ids || []))];
      if (allIds.length > 0) {
        const namesRes = await fetch('/api/tax/listing-names?ids=' + allIds.join(','));
        const names = await namesRes.json();
        listingNames = {};
        for (const n of names) listingNames[n.id] = n.nickname;
      }
      renderProperties();
    }

    function renderProperties() {
      const section = document.getElementById('props-section');
      if (!section) return;
      section.textContent = '';
      const header = document.createElement('div');
      header.className = 'props-header';
      const h3 = document.createElement('h3');
      h3.textContent = 'Properties';
      header.appendChild(h3);
      const addBtn = document.createElement('button');
      addBtn.className = 'btn-add';
      addBtn.textContent = '+ Add Property';
      addBtn.addEventListener('click', () => openPropertyModal());
      header.appendChild(addBtn);
      section.appendChild(header);

      const table = document.createElement('table');
      table.className = 'props';
      const thead = document.createElement('thead');
      const hrow = document.createElement('tr');
      for (const col of ['Cert #', 'Name', 'Listings', 'Owner', 'Active', '']) {
        const th = document.createElement('th');
        th.textContent = col;
        hrow.appendChild(th);
      }
      thead.appendChild(hrow);
      table.appendChild(thead);
      const tbody = document.createElement('tbody');
      for (const p of properties) {
        const tr = document.createElement('tr');
        const tdCert = document.createElement('td');
        tdCert.className = 'cert';
        tdCert.textContent = p.certificate_no;
        tr.appendChild(tdCert);
        const tdName = document.createElement('td');
        tdName.appendChild(document.createTextNode(p.name));
        if (p.address) {
          const ad = document.createElement('div');
          ad.className = 'addr';
          ad.textContent = p.address;
          tdName.appendChild(ad);
        }
        tr.appendChild(tdName);
        const tdList = document.createElement('td');
        tdList.className = 'listings-list';
        const nm = (p.listing_ids || []).map(id => listingNames[id] || '#' + id);
        tdList.textContent = nm.length === 0 ? 'None' : nm.length <= 2 ? nm.join(', ') : nm[0] + ' +' + (nm.length - 1) + ' more';
        tr.appendChild(tdList);
        const tdOwner = document.createElement('td');
        tdOwner.textContent = p.owner_name || '\u2014';
        tr.appendChild(tdOwner);
        const tdActive = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge ' + (p.active ? 'badge-active' : 'badge-inactive');
        badge.textContent = p.active ? 'Active' : 'Inactive';
        tdActive.appendChild(badge);
        tr.appendChild(tdActive);
        const tdAct = document.createElement('td');
        tdAct.className = 'action-btns';
        const editBtn = document.createElement('button');
        editBtn.className = 'btn-sm';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => openPropertyModal(p));
        tdAct.appendChild(editBtn);
        const delBtn = document.createElement('button');
        delBtn.className = 'btn-sm danger';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', async () => {
          if (!confirm('Delete this property?')) return;
          await fetch('/api/tax/properties', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: p.id }) });
          loadProperties();
        });
        tdAct.appendChild(delBtn);
        tr.appendChild(tdAct);
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      section.appendChild(table);
    }

    function openPropertyModal(prop = null) {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      const modal = document.createElement('div');
      modal.className = 'modal';
      const h3 = document.createElement('h3');
      h3.textContent = prop ? 'Edit Property' : 'Add Property';
      modal.appendChild(h3);
      const fields = [
        { key: 'certificate_no', label: 'Certificate #', ph: '#1234-25' },
        { key: 'name', label: 'Name', ph: 'Property name on tax form' },
        { key: 'address', label: 'Address', ph: '12345 E Street Rd' },
        { key: 'owner_name', label: 'Owner', ph: 'Owner name' },
      ];
      const fi = {};
      for (const f of fields) {
        const d = document.createElement('div'); d.className = 'form-field';
        const l = document.createElement('label'); l.textContent = f.label; d.appendChild(l);
        const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = f.ph;
        inp.value = prop ? (prop[f.key] || '') : ''; fi[f.key] = inp; d.appendChild(inp);
        modal.appendChild(d);
      }
      const cd = document.createElement('div'); cd.className = 'form-field form-check';
      const ci = document.createElement('input'); ci.type = 'checkbox'; ci.checked = prop ? prop.active : true; fi.active = ci;
      const cl = document.createElement('label'); cl.textContent = 'Active'; cl.style.marginBottom = '0';
      cd.appendChild(ci); cd.appendChild(cl); modal.appendChild(cd);
      const ld = document.createElement('div'); ld.className = 'form-field';
      const ll = document.createElement('label'); ll.textContent = 'Listing IDs (comma-separated)'; ld.appendChild(ll);
      const li = document.createElement('input'); li.type = 'text'; li.placeholder = '123, 456, 789';
      li.value = prop ? (prop.listing_ids || []).join(', ') : ''; fi.listing_ids = li; ld.appendChild(li);
      modal.appendChild(ld);
      const acts = document.createElement('div'); acts.className = 'modal-actions';
      const canBtn = document.createElement('button'); canBtn.className = 'btn-cancel'; canBtn.textContent = 'Cancel';
      canBtn.addEventListener('click', () => overlay.remove()); acts.appendChild(canBtn);
      const savBtn = document.createElement('button'); savBtn.className = 'btn-save'; savBtn.textContent = prop ? 'Save' : 'Add';
      savBtn.addEventListener('click', async () => {
        const payload = {
          certificate_no: fi.certificate_no.value.trim(), name: fi.name.value.trim(),
          address: fi.address.value.trim(), owner_name: fi.owner_name.value.trim() || null,
          active: fi.active.checked,
          listing_ids: fi.listing_ids.value.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n)),
        };
        if (prop) payload.id = prop.id;
        await fetch('/api/tax/properties', { method: prop ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        overlay.remove();
        loadProperties();
      });
      acts.appendChild(savBtn); modal.appendChild(acts);
      overlay.appendChild(modal); document.body.appendChild(overlay);
    }

    function saveOutputState(id) {
      const output = document.getElementById(`output-${id}`);
      if (output) {
        outputState[id] = Array.from(output.childNodes);
      }
    }

    const activeControllers = {};
    const PAYROLL_WEEK_START_DAY = 2; // Tuesday, JavaScript getDay() format: Sunday=0

    function toDateValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getYesterdayDateValue() {
      const date = new Date();
      date.setDate(date.getDate() - 1);
      return toDateValue(date);
    }

    function getPreviousCompletedWeekStartValue() {
      const date = new Date();
      date.setDate(date.getDate() - 1);
      const payrollWeekEndDay = (PAYROLL_WEEK_START_DAY + 6) % 7;
      const daysSinceWeekEnd = (date.getDay() - payrollWeekEndDay + 7) % 7;
      date.setDate(date.getDate() - daysSinceWeekEnd - 6);
      return toDateValue(date);
    }

    function updateScriptMode(id) {
      const script = scripts.find(sc => sc.id === id);
      if (!script?.modes?.length) return;
      const modeSelect = document.querySelector(`select[data-script="${id}"][data-input="mode"]`);
      const mode = script.modes.find(entry => entry.id === modeSelect?.value) || script.modes[0];
      const dateLabel = document.querySelector(`label[data-script="${id}"][data-label-for="date"]`);
      if (dateLabel) dateLabel.textContent = `${mode.dateLabel}:`;
      const dateInput = document.querySelector(`input[data-script="${id}"][data-input="date"]`);
      if (dateInput) {
        dateInput.value = mode.id === 'week'
          ? getPreviousCompletedWeekStartValue()
          : getYesterdayDateValue();
      }
    }

    async function runScript(id) {
      const btn = document.querySelector(`button[data-script="${id}"]`);
      const output = document.getElementById(`output-${id}`);

      if (activeControllers[id]) {
        activeControllers[id].abort();
        delete activeControllers[id];
        btn.textContent = 'Run';
        btn.classList.remove('running');
        saveOutputState(id);
        return;
      }

      const flags = {};
      document.querySelectorAll(`input[type="checkbox"][data-script="${id}"]`).forEach(el => {
        flags[el.dataset.flag] = el.checked;
      });

      const inputs = {};
      document.querySelectorAll(`[data-script="${id}"][data-input]`).forEach(el => {
        const value = typeof el.value === 'string' ? el.value.trim() : '';
        if (value) inputs[el.dataset.input] = value;
      });

      output.textContent = '';
      output.classList.add('visible');
      outputState[id] = [];
      btn.textContent = 'Stop';
      btn.classList.add('running');

      const controller = new AbortController();
      activeControllers[id] = controller;

      try {
        const res = await fetch(`/api/run/${id}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ flags, inputs }),
          signal: controller.signal,
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            try {
              const msg = JSON.parse(line.slice(6));
              // Only append if this tab is still active
              const currentOutput = document.getElementById(`output-${id}`);
              if (!currentOutput) {
                // Tab switched — save to state buffer
                appendToState(id, msg);
                continue;
              }
              appendToOutput(currentOutput, msg);
            } catch {}
          }
        }
      } catch (err) {
        if (err.name !== 'AbortError') {
          const currentOutput = document.getElementById(`output-${id}`);
          if (currentOutput) {
            const span = document.createElement('span');
            span.className = 'stderr';
            span.textContent = `Connection error: ${err.message}`;
            currentOutput.appendChild(span);
          }
        }
      }

      delete activeControllers[id];
      // Update button if still on this tab
      const currentBtn = document.querySelector(`button[data-script="${id}"]`);
      if (currentBtn) {
        currentBtn.textContent = 'Run';
        currentBtn.classList.remove('running');
      }
      saveOutputState(id);
    }

    function appendToOutput(output, msg) {
      if (msg.type === 'stdout') {
        output.appendChild(document.createTextNode(msg.data));
      } else if (msg.type === 'stderr') {
        const span = document.createElement('span');
        span.className = 'stderr';
        span.textContent = msg.data;
        output.appendChild(span);
      } else if (msg.type === 'exit') {
        const span = document.createElement('span');
        span.className = msg.data.code === 0 ? 'exit-ok' : 'exit-fail';
        span.textContent = `\nProcess exited with code ${msg.data.code}`;
        output.appendChild(span);
      } else if (msg.type === 'error') {
        const span = document.createElement('span');
        span.className = 'stderr';
        span.textContent = `Error: ${msg.data}`;
        output.appendChild(span);
      }
      output.scrollTop = output.scrollHeight;
      saveOutputState(output.id.replace('output-', ''));
    }

    function appendToState(id, msg) {
      if (!outputState[id]) outputState[id] = [];
      const temp = document.createElement('div');
      appendToOutput(temp, msg);
      for (const node of temp.childNodes) {
        outputState[id].push(node);
      }
    }

    // Listen for hash changes (back/forward)
    window.addEventListener('hashchange', () => {
      const hash = location.hash.slice(1);
      const s = scripts.find(sc => sc.id === hash);
      if (s) {
        activeTab = s.id;
        renderTabs();
        renderCard();
      }
    });

    loadScripts();
  </script>
